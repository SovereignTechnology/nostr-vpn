name: Upstream PR proofs

# Evidence for SovTech pull requests to mmalmi/nostr-vpn, on runners with root
# networking. Earlier proofs (WireGuard upstream rule, #160) are in this
# branch's history.
# - nat-proof: exit-node NAT with a local network inside the mesh range, shipped
#   rule vs this change, in throwaway network namespaces.
# - exit-node-e2e: upstream's private exit-node Docker e2e on the fork branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork branch under test
        default: fix/exit-nat-mesh-ingress
  push:
    branches: [sovtech/ci-proof]

permissions:
  contents: read

env:
  REF_UNDER_TEST: ${{ inputs.ref || 'fix/exit-nat-mesh-ingress' }}

jobs:
  nat-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install conntrack
        run: sudo apt-get update -qq && sudo apt-get install -y -qq conntrack
      - name: Shipped rule vs this change in throwaway network namespaces
        run: sudo bash .github/sovtech-proof/nat-proof.sh

  exit-node-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF_UNDER_TEST }}
      - name: Run the private exit-node e2e
        run: |
          set +e
          git log -1 --format='testing %H %s'
          ./scripts/e2e-exit-node-docker.sh > "$RUNNER_TEMP/e2e.log" 2>&1
          rc=$?
          echo "--- failure lines"
          grep -nE 'e2e failed|FAIL|Error:' "$RUNNER_TEMP/e2e.log" | head -n 40
          echo "--- last 40 lines"
          tail -n 40 "$RUNNER_TEMP/e2e.log"
          echo "e2e exit code: $rc"
          exit "$rc"
      - name: Keep the full e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-node-e2e-log
          path: ${{ runner.temp }}/e2e.log
          retention-days: 7
