name: Upstream PR proofs

# Evidence for SovTech pull requests to mmalmi/nostr-vpn, on runners with root
# networking or the Android SDK. Earlier proofs (WireGuard upstream rule, #160)
# are in this branch's history. Run on demand only:
#   gh workflow run sovtech-proof.yml --ref sovtech/ci-proof -f proof=<name> [-f ref=<branch>]
# - nat: the fork branch's isolated-namespace exit NAT regression, run through
#   scripts/test-linux-egress-lifecycle, plus upstream's private exit-node
#   Docker e2e on the same branch (#175). .github/sovtech-proof/nat-proof.sh is
#   the earlier proof of the shipped rule and is no longer run.
# - android: debug APKs of upstream master and the fork branch, under separate
#   test package names so they install side by side on a test phone (#158 item 3).
#   The phone check itself is .github/sovtech-proof/android-overlap.sh (adb).
# - ios: upstream's iOS device and simulator build of the fork branch, the
#   same steps as its consumer-validation workflow, to compile-check changes
#   to the packet tunnel provider (no paid Apple account here to run them).

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Which proof to run
        type: choice
        options: [nat, android, ios]
        default: android
      ref:
        description: Fork branch under test
        default: fix/mobile-mesh-peer-routes

permissions:
  contents: read

jobs:
  # The branch's own isolated-namespace regression, through the repo's runner.
  nat-namespace-test:
    if: inputs.proof == 'nat'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Install build and namespace test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-1-dev libclang-dev clang libnftnl-dev libmnl-dev pkg-config nftables iptables python3
      - name: Build the test executable and nvpn
        run: |
          git log -1 --format='testing %H %s'
          cargo build --locked -p nvpn
          cargo test --locked -p nvpn --no-run 2>&1 | tee "$RUNNER_TEMP/no-run.log"
          exe=$(grep -oE 'unittests src/main.rs \(target/debug/deps/nvpn-[0-9a-f]+\)' "$RUNNER_TEMP/no-run.log" | grep -oE 'target/debug/deps/nvpn-[0-9a-f]+')
          echo "NVPN_TEST_EXE=$exe" >> "$GITHUB_ENV"
      - name: Exit NAT regression in an isolated root namespace
        run: |
          nft --version; iptables --version
          scripts/test-linux-egress-lifecycle "$NVPN_TEST_EXE" target/debug/nvpn \
            platform_routing::linux_exit_nat_tests::exit_nat_masquerades_only_traffic_from_the_mesh_interface

  exit-node-e2e:
    if: inputs.proof == 'nat'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Run the private exit-node e2e
        run: |
          set +e
          git log -1 --format='testing %H %s'
          ./scripts/e2e-exit-node-docker.sh > "$RUNNER_TEMP/e2e.log" 2>&1
          rc=$?
          echo "--- failure lines"
          grep -nE 'e2e failed|FAIL|Error:' "$RUNNER_TEMP/e2e.log" | head -n 40
          echo "--- last 40 lines"
          tail -n 40 "$RUNNER_TEMP/e2e.log"
          echo "e2e exit code: $rc"
          exit "$rc"
      - name: Keep the full e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-node-e2e-log
          path: ${{ runner.temp }}/e2e.log
          retention-days: 7

  # Same toolchain as upstream's consumer-validation Android job.
  android-apk:
    if: inputs.proof == 'android'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            ref: master
          - variant: after
            ref: ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref || inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Install Android Rust build tools
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build the debug app under a test package name
        shell: bash
        env:
          NVPN_ANDROID_PACKAGE: org.sovtech.nvpntest.${{ matrix.variant }}
        run: |
          git log -1 --format='building %H %s'
          tools/run-android build --no-daemon --max-workers=2
          mkdir -p "$RUNNER_TEMP/apk"
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          cp "$apk" "$RUNNER_TEMP/apk/nvpntest-${{ matrix.variant }}.apk"
          git rev-parse HEAD > "$RUNNER_TEMP/apk/nvpntest-${{ matrix.variant }}.commit"
          sha256sum "$RUNNER_TEMP/apk/"*
      - uses: actions/upload-artifact@v4
        with:
          name: nvpntest-${{ matrix.variant }}
          path: ${{ runner.temp }}/apk
          retention-days: 7

  ios-build:
    if: inputs.proof == 'ios'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Prepare iOS build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcrun simctl list devices available --json | python3 -c \
            'import json,sys; print("NVPN_IOS_SIMULATOR_NAME=" + next(d["name"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))' >> "$GITHUB_ENV"
      - name: Build iOS device and simulator app
        shell: bash
        run: |
          git log -1 --format='building %H %s'
          mkdir -p validation
          tools/run-ios build 2>&1 | tee validation/ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: validation
          retention-days: 7
